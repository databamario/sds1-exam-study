<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sds1 sound effects</title>
  </head>
  <body>
    <!-- Draws nothing and needs no build step: index.js speaks Streamlit's
         postMessage component protocol directly, with no React and no bundler.
         A Streamlit deploy runs `streamlit run` and never `npm install`, so a
         component that had to be compiled would not work on the cloud.

         The four .wav files live in this directory, which is the whole point:
         Streamlit serves a declared component's own directory, so they load by
         relative path from wherever the component is mounted. That is why the
         sound moved off `static/` - see index.js for what went wrong there. -->
    <script src="./index.js"></script>
  </body>
</html>
